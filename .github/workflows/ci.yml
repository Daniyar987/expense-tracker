name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run mypy
        run: uv run mypy src tests
      
      - name: Run ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      
      - name: Run tests
        run: uv run pytest -v