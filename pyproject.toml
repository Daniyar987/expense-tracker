[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]
   
   
   [project]
   name = "expense_tracker"
   version = "1.0.0"
   description = "Personal expense tracking application"
   requires-python = ">=3.10"
   dependencies = [
       "fastapi>=0.100.0",
       "uvicorn>=0.23.0",
   ]

   [project.scripts]
   expense-cli = "expense_tracker.interfaces.cli:main"

   [dependency-groups]
   dev = [
       "pytest>=7.4.0",
       "mypy>=1.5.0",
       "ruff>=0.1.0",
       "httpx>=0.24.0",
   ]

   [tool.mypy]
   strict = true
   disallow_untyped_defs = true
   warn_return_any = true

   [tool.ruff]
   line-length = 88
   target-version = "py310"

   [tool.ruff.lint]
   select = ["E", "F", "I", "UP"]

   [tool.pytest.ini_options]
   testpaths = ["tests"]